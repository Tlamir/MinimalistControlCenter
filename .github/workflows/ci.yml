name: Read-only diagnostics CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain
        run: rustup update stable --no-self-update && rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo test --all-targets --release --locked
      - run: cargo build --release --locked
      - name: Audit Windows executable imports
        if: runner.os == 'Windows'
        run: python scripts/audit_binary.py target/release/mcc.exe
      - name: Assert diagnostics and reject controls
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = (& target/release/mcc.exe status --json | ConvertFrom-Json)
          if ($report.mode -ne 'read_only' -or $report.hardware_control_available) { throw 'Invalid safety boundary' }
          & target/release/mcc.exe fan 0 --force
          if ($LASTEXITCODE -ne 2) { throw 'Control was not rejected' }
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows'
        with:
          name: mcc-windows-x64-read-only
          path: target/release/mcc.exe
          retention-days: 14
